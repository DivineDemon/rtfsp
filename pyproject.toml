[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtfsp"
version = "0.1.0"
description = "Real-Time Fraud Scoring Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=3.3.0",
    "xgboost>=1.7.0",
    "scipy>=1.10.0",
    "redis>=4.5.0",
    "duckdb>=0.8.0",
    "requests>=2.28.0",
    "pytest>=7.3.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
